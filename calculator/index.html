<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Define a codificação de caracteres da página -->
    <meta charset="UTF-8">

    <!-- Permite que a página se adapte a diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <!-- Referencia o arquivo responsável pelos estilos da página -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Agrupa todos os elementos que formam a calculadora -->
    <main class="calculator">

        <!-- Área responsável por exibir a operação e o resultado -->
        <div class="display">
            <span class="equals-sign">=</span>

            <div class="display-values">
                <span class="operation">0</span>
                <span class="result">0</span>
            </div>
        </div>

        <!-- Organiza os botões que formam o teclado da calculadora -->
        <div class="keyboard">

            <button class="button clear-entry">CE</button>
            <button class="button">C</button>
            <button class="button">%</button>
            <button class="button operator divide">÷</button>

            <button class="button">7</button>
            <button class="button">8</button>
            <button class="button">9</button>
            <button class="button operator">×</button>

            <button class="button">4</button>
            <button class="button">5</button>
            <button class="button">6</button>
            <button class="button operator">−</button>

            <button class="button">1</button>
            <button class="button">2</button>
            <button class="button">3</button>
            <button class="button operator">+</button>

            <button class="button">±</button>
            <button class="button">0</button>
            <button class="button">,</button>
            <button class="button equals">=</button>

        </div>

    </main>

    <!-- Referencia o arquivo responsável pelo comportamento da calculadora -->
    <script src="script.js"></script>

</body>

</html>
